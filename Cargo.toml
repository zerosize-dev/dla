[workspace]
resolver = "3"
members = ["crates/*", "bench/runner"]
exclude = ["bench/fixtures"]

[workspace.package]
edition = "2024"
version = "0.9.0-preview.12"
rust-version = "1.89"
repository = "https://github.com/zerosize-dev/dla"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
dla-core = { path = "crates/dla-core", version = "0.9.0-preview.12" }
dla-report = { path = "crates/dla-report", version = "0.9.0-preview.12" }
dla-probe = { path = "crates/dla-probe", version = "0.9.0-preview.12" }
dla-backends = { path = "crates/dla-backends", version = "0.9.0-preview.12" }
dla-census = { path = "crates/dla-census", version = "0.9.0-preview.12" }
dla-workload = { path = "crates/dla-workload", version = "0.9.0-preview.12" }
dla-stats = { path = "crates/dla-stats", version = "0.9.0-preview.12" }
dla-sample = { path = "crates/dla-sample", version = "0.9.0-preview.12" }
dla-parsers = { path = "crates/dla-parsers", version = "0.9.0-preview.12" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1", features = ["chrono04"] }
thiserror = "2"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
getrandom = "0.3"
tempfile = "3"
assert_cmd = "2"
predicates = "3"
regex = "1"
toml = "0.9"
jsonschema = { version = "0.33", default-features = false }
signal-hook = "0.3"
tree-sitter = "0.26"
tree-sitter-java = "0.23"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-go = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.25"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"

[workspace.lints.rust]
# Denied, not forbidden: dla-sample opts in for libproc and Win32 calls in its
# platform modules only.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# The census compiles hundreds of regexes and parses every source file; in an unoptimized build
# that is minutes on a large repository. These dependencies are optimized in every profile that
# is not release (their code does not change what the census finds).
[profile.dev.package.regex]
opt-level = 3
[profile.dev.package.regex-automata]
opt-level = 3
[profile.dev.package.regex-syntax]
opt-level = 3
[profile.dev.package.aho-corasick]
opt-level = 3
[profile.dev.package.memchr]
opt-level = 3
[profile.dev.package.tree-sitter]
opt-level = 3
[profile.dev.package.tree-sitter-java]
opt-level = 3
[profile.dev.package.tree-sitter-kotlin-ng]
opt-level = 3
[profile.dev.package.tree-sitter-go]
opt-level = 3
[profile.dev.package.tree-sitter-rust]
opt-level = 3
[profile.dev.package.tree-sitter-javascript]
opt-level = 3
[profile.dev.package.tree-sitter-typescript]
opt-level = 3
[profile.dev.package.tree-sitter-python]
opt-level = 3
[profile.dev.package.tree-sitter-c]
opt-level = 3
[profile.dev.package.tree-sitter-cpp]
opt-level = 3

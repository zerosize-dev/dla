[workspace]
resolver = "3"
members = ["crates/*", "bench/runner"]
exclude = ["bench/fixtures"]

[workspace.package]
edition = "2024"
version = "0.1.0"
rust-version = "1.89"
repository = "https://github.com/zerosize-dev/dla"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
dla-core = { path = "crates/dla-core", version = "0.1.0" }
dla-report = { path = "crates/dla-report", version = "0.1.0" }
dla-probe = { path = "crates/dla-probe", version = "0.1.0" }
dla-backends = { path = "crates/dla-backends", version = "0.1.0" }
dla-census = { path = "crates/dla-census", version = "0.1.0" }
dla-workload = { path = "crates/dla-workload", version = "0.1.0" }
dla-stats = { path = "crates/dla-stats", version = "0.1.0" }
dla-sample = { path = "crates/dla-sample", version = "0.1.0" }
dla-parsers = { path = "crates/dla-parsers", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1", features = ["chrono04"] }
thiserror = "2"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
getrandom = "0.3"
tempfile = "3"
assert_cmd = "2"
predicates = "3"
regex = "1"
toml = "0.9"
jsonschema = { version = "0.33", default-features = false }
signal-hook = "0.3"
tree-sitter = "0.26"
tree-sitter-java = "0.23"
tree-sitter-kotlin-ng = "1.1"
tree-sitter-go = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.25"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"

[workspace.lints.rust]
# Denied, not forbidden: dla-sample opts in for libproc and Win32 calls in its
# platform modules only.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

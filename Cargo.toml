[workspace]
resolver = "3"
members = ["crates/*", "bench/runner"]
exclude = ["bench/fixtures"]

[workspace.package]
edition = "2024"
version = "0.1.0"
rust-version = "1.85"
repository = "https://github.com/zerosize-dev/dla"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
dla-core = { path = "crates/dla-core", version = "0.1.0" }
dla-report = { path = "crates/dla-report", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1", features = ["chrono04"] }
thiserror = "2"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
getrandom = "0.3"
tempfile = "3"
assert_cmd = "2"
predicates = "3"
regex = "1"
toml = "0.9"
jsonschema = { version = "0.33", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

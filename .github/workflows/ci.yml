name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Claude Code CLI used for plugin validation. 2.1.289 or later validates the
  # marketplace manifest and plugin.json together.
  CLAUDE_CODE_VERSION: "2.1.319"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  test:
    name: clippy and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  schema:
    name: schemas are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -p dla-cli -- schema --check

  bench:
    name: benchmark tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build dla-bench
        run: cargo build -p dla-bench
      - name: Fixtures validate against the schema and the fixture rules
        run: ./target/debug/dla-bench validate
      - name: Benchmark schemas are up to date
        run: ./target/debug/dla-bench schema --check
      - name: The Rust and Python graders agree on every sample
        shell: bash
        run: |
          set -eu
          found=0
          for s in bench/runner/testdata/*/; do
            s=${s%/}
            name=$(basename "$s")
            found=1
            ./target/debug/dla-bench grade "$s/results" --fixtures "$s/fixtures" --out "$RUNNER_TEMP/$name.rust.json"
            python3 bench/runner/grade.py "$s/results" --fixtures "$s/fixtures" --out "$RUNNER_TEMP/$name.py.json"
            ./target/debug/dla-bench compare "$RUNNER_TEMP/$name.rust.json" "$RUNNER_TEMP/$name.py.json"
            for golden in "$s/expected-metrics.json" "$s/metrics.json"; do
              if [ -f "$golden" ]; then
                ./target/debug/dla-bench compare "$RUNNER_TEMP/$name.rust.json" "$golden"
              fi
            done
          done
          [ "$found" = 1 ] || { echo "::error::no grader samples under bench/runner/testdata"; exit 1; }
      - name: Python grader unit tests
        run: python3 -m unittest discover -s bench/runner -p 'test_*.py'

  static:
    name: static acceptance on the fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build dla and dla-bench
        run: cargo build -p dla-cli -p dla-bench
      # Most external analyzers are absent on the runner: the built-in census and
      # the DLA rules alone must still flag every confirmable leak, with the
      # archetype data present and with it removed.
      - name: dla-bench static (archetypes on)
        run: ./target/debug/dla-bench static --dla-bin ./target/debug/dla --json "$RUNNER_TEMP/static-on.json"
      - name: dla-bench static (archetypes off)
        run: ./target/debug/dla-bench static --archetypes off --dla-bin ./target/debug/dla --json "$RUNNER_TEMP/static-off.json"
      - name: Upload the static results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: static-acceptance
          path: |
            ${{ runner.temp }}/static-on.json
            ${{ runner.temp }}/static-off.json
          if-no-files-found: ignore

  plugin:
    name: plugin validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install Claude Code CLI
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
      - run: claude --version
      - name: Validate marketplace, plugin manifest, skills, agents and hooks
        run: claude plugin validate . --strict
      - name: The skill is exposed by the plugin (no model call)
        run: |
          details=$(claude --plugin-dir . plugin details dla)
          printf '%s\n' "$details"
          printf '%s\n' "$details" | grep -q 'detect-leak-anywhere' || { echo "::error::detect-leak-anywhere is not listed by 'claude plugin details dla'"; exit 1; }
      - name: Entry points keep their executable bit
        run: |
          for f in bin/dla hooks/fetch-dla.sh tests/shim/run.sh; do
            mode=$(git ls-files -s "$f" | cut -d' ' -f1)
            if [ "$mode" != "100755" ]; then
              echo "::error file=$f::$f must be committed with mode 100755 (found '$mode')"
              exit 1
            fi
          done

  shim:
    name: shim and downloader (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the binary
        run: cargo build -p dla-cli
      - name: Run the shim tests
        shell: bash
        run: tests/shim/run.sh

  plugin-eval:
    name: plugin eval smoke subset
    runs-on: ubuntu-latest
    # Model calls cost money, so this job runs only on pushes and on pull
    # requests from this repository, and only when the secret is available.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: Check for the API key
        id: key
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::ANTHROPIC_API_KEY is not set; skipping the plugin eval smoke subset"
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.key.outputs.available == 'true'
      - uses: actions/setup-node@v5
        if: steps.key.outputs.available == 'true'
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        if: steps.key.outputs.available == 'true'
      - uses: Swatinem/rust-cache@v2
        if: steps.key.outputs.available == 'true'
      - name: Install Claude Code CLI
        if: steps.key.outputs.available == 'true'
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
      - name: Install the sandbox prerequisites
        if: steps.key.outputs.available == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap socat
          # Ubuntu 24.04 restricts unprivileged user namespaces, which bubblewrap needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Build dla
        if: steps.key.outputs.available == 'true'
        run: |
          # Build outside the checkout and place only the binary where the shim looks
          # for a development build: the eval refuses a plugin directory that holds
          # hard-linked files, and cargo's target directory is full of them.
          CARGO_TARGET_DIR="$RUNNER_TEMP/dla-target" cargo build -p dla-cli
          mkdir -p target/debug
          cp "$RUNNER_TEMP/dla-target/debug/dla" target/debug/dla
      - name: Run the smoke subset
        if: steps.key.outputs.available == 'true'
        # Informational until dla ledger confirm exists (M3): before then the
        # leak case cannot reach a confirmed finding, so no score threshold.
        env:
          DLA_BENCH_MODEL: ${{ vars.DLA_BENCH_MODEL }}
        run: |
          model_args=()
          if [ -n "${DLA_BENCH_MODEL:-}" ]; then model_args=(--model "$DLA_BENCH_MODEL"); fi
          claude plugin eval . \
            --eval-dir bench/evals \
            --tag smoke \
            --scaffold \
            --allow-tools Bash \
            --ablation none \
            --trust-plugin \
            --no-publish \
            --max-cost-usd 15 \
            "${model_args[@]}" \
            --json "$RUNNER_TEMP/plugin-eval.json"
      - name: Upload the eval result
        if: always() && steps.key.outputs.available == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: plugin-eval-smoke
          path: |
            ${{ runner.temp }}/plugin-eval.json
            bench/evals/results/
          if-no-files-found: ignore

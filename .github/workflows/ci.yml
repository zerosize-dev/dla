name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Claude Code CLI used for plugin validation. 2.1.289 or later validates the
  # marketplace manifest and plugin.json together.
  CLAUDE_CODE_VERSION: "2.1.319"

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  test:
    name: clippy and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace --no-fail-fast

  schema:
    name: schemas are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -p dla-cli -- schema --check

  bench:
    name: benchmark tooling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build dla-bench
        run: cargo build -p dla-bench
      - name: Fixtures validate against the schema and the fixture rules
        run: ./target/debug/dla-bench validate
      - name: Benchmark schemas are up to date
        run: ./target/debug/dla-bench schema --check
      - name: The Rust and Python graders agree on every sample
        shell: bash
        run: |
          set -eu
          found=0
          for s in bench/runner/testdata/*/; do
            s=${s%/}
            name=$(basename "$s")
            found=1
            ./target/debug/dla-bench grade "$s/results" --fixtures "$s/fixtures" --out "$RUNNER_TEMP/$name.rust.json"
            python3 bench/runner/grade.py "$s/results" --fixtures "$s/fixtures" --out "$RUNNER_TEMP/$name.py.json"
            ./target/debug/dla-bench compare "$RUNNER_TEMP/$name.rust.json" "$RUNNER_TEMP/$name.py.json"
            for golden in "$s/expected-metrics.json" "$s/metrics.json"; do
              if [ -f "$golden" ]; then
                ./target/debug/dla-bench compare "$RUNNER_TEMP/$name.rust.json" "$golden"
              fi
            done
          done
          [ "$found" = 1 ] || { echo "::error::no grader samples under bench/runner/testdata"; exit 1; }
      - name: Python grader unit tests
        run: python3 -m unittest discover -s bench/runner -p 'test_*.py'

  static:
    name: static acceptance on the fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build dla and dla-bench
        run: cargo build -p dla-cli -p dla-bench
      # Most external analyzers are absent on the runner: the built-in census and
      # the DLA rules alone must still flag every confirmable leak, with the
      # archetype data present and with it removed.
      - name: dla-bench static (archetypes on)
        run: ./target/debug/dla-bench static --dla-bin ./target/debug/dla --json "$RUNNER_TEMP/static-on.json"
      - name: dla-bench static (archetypes off)
        run: ./target/debug/dla-bench static --archetypes off --dla-bin ./target/debug/dla --json "$RUNNER_TEMP/static-off.json"
      - name: Upload the static results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: static-acceptance
          path: |
            ${{ runner.temp }}/static-on.json
            ${{ runner.temp }}/static-off.json
          if-no-files-found: ignore

  dynamic:
    name: dynamic acceptance on the fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-go@v6
        with:
          go-version: "1.24"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # The Python version pairs run on the exact CPython releases their [toolchain] names; the
      # runner installs them with `uv python install`. The Node and Go releases are fetched by
      # the runner itself.
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.5"
          enable-cache: false
      # The fetched releases are kept between CI runs. The job runs the archetypes-on arm only,
      # so no second arm of the same run reuses them.
      - uses: actions/cache@v4
        with:
          path: target/dla-bench-toolchains
          key: dla-bench-toolchains-${{ hashFiles('bench/fixtures/*/expected.toml') }}
          restore-keys: dla-bench-toolchains-
      # jni-order-codec compiles Kotlin. The runner has no ~/.m2 with the compiler jars,
      # so install the official compiler zip (pinned, with its checksum) and put the
      # stdlib where the fixture's build.sh looks for it when it runs the classes.
      - name: Kotlin compiler 2.0.21
        run: |
          set -eu
          url=https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip
          sha256=0352c0a45bd22f80f6b26e485cd04da8047baa5de54865281fb9f89a4a7bcf2a
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/kotlin-compiler.zip" "$url"
          echo "$sha256  $RUNNER_TEMP/kotlin-compiler.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/kotlin-compiler.zip" -d "$RUNNER_TEMP/kotlin"
          echo "$RUNNER_TEMP/kotlin/kotlinc/bin" >> "$GITHUB_PATH"
          stdlib="$HOME/.m2/repository/org/jetbrains/kotlin/kotlin-stdlib/2.0.21"
          mkdir -p "$stdlib"
          cp "$RUNNER_TEMP/kotlin/kotlinc/lib/kotlin-stdlib.jar" "$stdlib/kotlin-stdlib-2.0.21.jar"
          "$RUNNER_TEMP/kotlin/kotlinc/bin/kotlinc" -version
      # valgrind and heaptrack are the native backends the per-operation policy runs.
      - name: C toolchain, addr2line, valgrind and heaptrack
        run: sudo apt-get -o Acquire::Retries=5 update && sudo apt-get -o Acquire::Retries=5 install -y build-essential binutils valgrind heaptrack
      - name: Build dla and dla-bench
        run: cargo build -p dla-cli -p dla-bench
      # The harness runs of the fixtures take 10 to 90 s each. The archetypes-off
      # path is covered by the static job, so it is not repeated here.
      - name: dla-bench dynamic
        run: ./target/debug/dla-bench dynamic --dla-bin ./target/debug/dla --parallel 4 --json "$RUNNER_TEMP/dynamic.json"
      - name: Upload the dynamic results and logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: dynamic-acceptance
          path: |
            ${{ runner.temp }}/dynamic.json
            ${{ runner.temp }}/dynamic.logs
          if-no-files-found: ignore

  plugin:
    name: plugin validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install Claude Code CLI
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
      - run: claude --version
      - name: Validate marketplace, plugin manifest, skills, agents and hooks
        run: claude plugin validate . --strict
      - name: The skill is exposed by the plugin (no model call)
        run: |
          details=$(claude --plugin-dir . plugin details dla)
          printf '%s\n' "$details"
          printf '%s\n' "$details" | grep -q 'detect-leak-anywhere' || { echo "::error::detect-leak-anywhere is not listed by 'claude plugin details dla'"; exit 1; }
      - name: Entry points keep their executable bit
        run: |
          for f in bin/dla hooks/fetch-dla.sh tests/shim/run.sh; do
            mode=$(git ls-files -s "$f" | cut -d' ' -f1)
            if [ "$mode" != "100755" ]; then
              echo "::error file=$f::$f must be committed with mode 100755 (found '$mode')"
              exit 1
            fi
          done

  shim:
    name: shim and downloader (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the binary
        run: cargo build -p dla-cli
      - name: Run the shim tests
        shell: bash
        run: tests/shim/run.sh
      - name: Build and run the allocator shim
        if: runner.os != 'Windows'
        shell: bash
        run: tests/shim/alloc-shim.sh

  # Integration suite: dla runs inside microVMs through rightsize (microsandbox
  # backend). No model call and no credential is involved. The VM jobs need
  # hardware virtualization: ubuntu-latest exposes /dev/kvm, windows-2025 has the
  # Windows Hypervisor Platform. macOS runners cannot nest VMs, so macOS has no
  # job here. The guests are Linux, so every job uses the same static musl dla.
  it-build:
    name: integration suite, build the static dla
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          key: it-musl
      - name: Install musl tools
        run: sudo apt-get -o Acquire::Retries=5 update && sudo apt-get -o Acquire::Retries=5 install -y musl-tools
      - name: Build dla for the guests
        run: cargo build --release --locked -p dla-cli --target x86_64-unknown-linux-musl
      - name: Lint the integration tests with the VM feature
        run: cargo clippy --locked -p dla-it --features sandbox-it --all-targets -- -D warnings
      - uses: actions/upload-artifact@v5
        with:
          name: dla-it-bin
          path: target/x86_64-unknown-linux-musl/release/dla
          if-no-files-found: error

  it-linux:
    name: integration suite (ubuntu, microVM)
    needs: it-build
    runs-on: ubuntu-latest # GitHub-hosted runners expose /dev/kvm
    timeout-minutes: 60
    env:
      RIGHTSIZE_BACKEND: microsandbox
      DLA_IT_REQUIRE_VM: "1"
      DLA_IT_BIN_DIR: ${{ github.workspace }}/dla-it-bin
      DLA_IT_OUT: ${{ github.workspace }}/dla-it-out
    steps:
      - uses: actions/checkout@v5
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: it-linux
      - uses: actions/download-artifact@v5
        with:
          name: dla-it-bin
          path: dla-it-bin
      # Image pulls are rate limited on shared runner addresses, so the image
      # cache grows from run to run. The msb install is cached too, keyed on a
      # hash of crates/dla-it/Cargo.toml, where the rightsize-msb version is pinned.
      - uses: actions/cache/restore@v4
        with:
          path: ~/.microsandbox/cache
          key: dla-it-msb-images-${{ runner.os }}-${{ github.run_id }}
          restore-keys: dla-it-msb-images-${{ runner.os }}-
      - id: msb-install
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/rightsize/msb
          key: dla-it-msb-install-${{ runner.os }}-${{ hashFiles('crates/dla-it/Cargo.toml') }}
      - name: Run the suite
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$DLA_IT_OUT"
          cargo test -p dla-it --features sandbox-it -- --nocapture 2>&1 | tee "$DLA_IT_OUT/it-output.log"
      # Counts the agent-relay retry notes the backend writes to stderr, so a run
      # shows how often the retry fires even when every test passed. The step never
      # fails the job (a grep that finds nothing exits 1, hence the `|| true`).
      - name: Count agent-relay retries
        if: always()
        shell: bash
        run: |
          count() { grep 'agent-relay retry:' "$DLA_IT_OUT/it-output.log" 2>/dev/null | grep -c -F -- "$1" || true; }
          echo "::notice title=agent-relay retry::fired $(count '(attempt 1 of 2)'), booted on attempt 2 $(count 'booted on attempt 2'), gave up $(count '(attempt 2 of 2); giving up')"
      - name: Purge the image cache if it was corrupted
        if: always()
        shell: bash
        run: |
          if grep -q "cache error at .*No such file" "$DLA_IT_OUT/it-output.log" 2>/dev/null; then
            echo "image cache corruption detected, purging before save"
            rm -rf ~/.microsandbox/cache
          fi
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: ~/.microsandbox/cache
          key: dla-it-msb-images-${{ runner.os }}-${{ github.run_id }}
      - name: Check that the msb install is complete
        id: msb-install-complete
        if: always() && steps.msb-install.outputs.cache-hit != 'true'
        shell: bash
        run: |
          if ls ~/.cache/rightsize/msb/*/bin/msb* >/dev/null 2>&1; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/cache/save@v4
        if: always() && steps.msb-install-complete.outputs.complete == 'true'
        with:
          path: ~/.cache/rightsize/msb
          key: dla-it-msb-install-${{ runner.os }}-${{ hashFiles('crates/dla-it/Cargo.toml') }}
      - name: Upload the recorded facts and logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: dla-it-linux
          path: dla-it-out
          if-no-files-found: ignore

  # WHP on windows-2025 is already enabled on the hosted image. The job is not
  # required: microsandbox on Windows is newer, and concurrent msb runs hit an
  # SQLite race there, so the tests run one at a time.
  it-windows:
    name: integration suite (windows-2025, WHP)
    needs: it-build
    runs-on: windows-2025
    continue-on-error: true
    timeout-minutes: 60
    env:
      RIGHTSIZE_BACKEND: microsandbox
      DLA_IT_REQUIRE_VM: "1"
      DLA_IT_BIN_DIR: ${{ github.workspace }}/dla-it-bin
      DLA_IT_OUT: ${{ github.workspace }}/dla-it-out
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: it-windows
      - uses: actions/download-artifact@v5
        with:
          name: dla-it-bin
          path: dla-it-bin
      # Same caches as the Linux job, at the Windows paths of msb.
      - uses: actions/cache/restore@v4
        with:
          path: ~/.microsandbox/cache
          key: dla-it-msb-images-${{ runner.os }}-${{ github.run_id }}
          restore-keys: dla-it-msb-images-${{ runner.os }}-
      - id: msb-install
        uses: actions/cache/restore@v4
        with:
          path: ~\AppData\Local\rightsize\msb
          key: dla-it-msb-install-${{ runner.os }}-${{ hashFiles('crates/dla-it/Cargo.toml') }}
      # The output goes to a file, not through `tee`: on runs 106 and 108 every test
      # passed in about 12 s and the step then sat idle until the job timeout, the
      # sign of a process the tests leave behind holding the pipe open. The next step
      # lists what is still running.
      - name: Run the suite
        shell: bash
        timeout-minutes: 15
        run: |
          mkdir -p "$DLA_IT_OUT"
          rc=0
          cargo test -p dla-it --features sandbox-it -- --nocapture --test-threads=1 > "$DLA_IT_OUT/it-output.log" 2>&1 || rc=$?
          cat "$DLA_IT_OUT/it-output.log"
          exit $rc
      - name: List the processes left after the suite
        if: always()
        shell: pwsh
        run: |
          Get-CimInstance Win32_Process |
            Where-Object { $_.Name -notmatch '^(svchost|System|Idle|Registry|smss|csrss|wininit|services|lsass|winlogon|fontdrvhost|dwm|conhost|Runner\.(Listener|Worker))(\.exe)?$' } |
            Select-Object Name, ProcessId, ParentProcessId, CommandLine |
            Format-Table -AutoSize -Wrap | Out-String -Width 400
      # Counts the agent-relay retry notes the backend writes to stderr, so a run
      # shows how often the retry fires even when every test passed. The step never
      # fails the job (a grep that finds nothing exits 1, hence the `|| true`).
      - name: Count agent-relay retries
        if: always()
        shell: bash
        run: |
          count() { grep 'agent-relay retry:' "$DLA_IT_OUT/it-output.log" 2>/dev/null | grep -c -F -- "$1" || true; }
          echo "::notice title=agent-relay retry::fired $(count '(attempt 1 of 2)'), booted on attempt 2 $(count 'booted on attempt 2'), gave up $(count '(attempt 2 of 2); giving up')"
      - name: Purge the image cache if it was corrupted
        if: always()
        shell: bash
        run: |
          if grep -q "cache error at .*No such file" "$DLA_IT_OUT/it-output.log" 2>/dev/null; then
            echo "image cache corruption detected, purging before save"
            rm -rf ~/.microsandbox/cache
          fi
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: ~/.microsandbox/cache
          key: dla-it-msb-images-${{ runner.os }}-${{ github.run_id }}
      - name: Check that the msb install is complete
        id: msb-install-complete
        if: always() && steps.msb-install.outputs.cache-hit != 'true'
        shell: bash
        run: |
          if ls ~/AppData/Local/rightsize/msb/*/bin/msb* >/dev/null 2>&1; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/cache/save@v4
        if: always() && steps.msb-install-complete.outputs.complete == 'true'
        with:
          path: ~\AppData\Local\rightsize\msb
          key: dla-it-msb-install-${{ runner.os }}-${{ hashFiles('crates/dla-it/Cargo.toml') }}
      - name: Upload the recorded facts and logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: dla-it-windows
          path: dla-it-out
          if-no-files-found: ignore

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the release (tag v<workspace version> on this commit); off = dry run"
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: verify versions
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.versions.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - name: Tag, plugin.json, marketplace.json and workspace version must agree
        id: versions
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          workspace=$(awk '/^\[workspace\.package\]/{p=1;next} /^\[/{p=0} p && /^version[[:space:]]*=/{gsub(/[" ]/,"",$3); print $3; exit}' Cargo.toml)
          plugin=$(jq -r '.version' .claude-plugin/plugin.json)
          market=$(jq -r '.plugins[0].version // empty' .claude-plugin/marketplace.json)
          echo "tag=$tag workspace=$workspace plugin=$plugin marketplace=${market:-<unset>}"
          test -n "$workspace" || { echo "::error::cannot read the workspace version from Cargo.toml"; exit 1; }
          if [ "$EVENT" = "push" ]; then
            test "$tag" = "v$workspace" || { echo "::error::tag $tag does not match workspace version $workspace"; exit 1; }
          else
            # A manual run publishes (when asked) under the tag of the workspace version.
            tag="v$workspace"
            echo "manual run: the release tag is $tag"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          test "$plugin" = "$workspace" || { echo "::error::plugin.json version $plugin does not match workspace version $workspace"; exit 1; }
          if [ -n "$market" ] && [ "$market" != "$workspace" ]; then
            echo "::error::marketplace.json version $market does not match workspace version $workspace"
            exit 1
          fi

  build:
    name: build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            musl: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            musl: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install musl tools
        if: matrix.musl
        run: sudo apt-get -o Acquire::Retries=5 update && sudo apt-get -o Acquire::Retries=5 install -y musl-tools
      - name: Build
        run: cargo build --release --locked -p dla-cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -eu
          exe=dla
          case "$TARGET" in *windows*) exe=dla.exe ;; esac
          mkdir -p dist
          archive="dla-${TARGET}.tar.gz"
          tar -czf "dist/${archive}" -C "target/${TARGET}/release" "$exe"
          cd dist
          if command -v sha256sum >/dev/null 2>&1; then
            sum=$(sha256sum "$archive" | cut -d' ' -f1)
          else
            sum=$(shasum -a 256 "$archive" | cut -d' ' -f1)
          fi
          printf '%s  %s\n' "$sum" "$archive" > "${archive}.sha256"
          cat "${archive}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: dla-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  assemble:
    name: assemble and verify checksums
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dla-*
          merge-multiple: true
      - name: Check the five targets are present and combine checksums
        working-directory: dist
        run: |
          set -eu
          for t in aarch64-apple-darwin x86_64-apple-darwin x86_64-unknown-linux-musl aarch64-unknown-linux-musl x86_64-pc-windows-msvc; do
            test -f "dla-${t}.tar.gz" || { echo "::error::missing dla-${t}.tar.gz"; exit 1; }
            test -f "dla-${t}.tar.gz.sha256" || { echo "::error::missing dla-${t}.tar.gz.sha256"; exit 1; }
          done
          cat dla-*.tar.gz.sha256 | sort -k2 > SHA256SUMS
          sha256sum --check SHA256SUMS
          ls -l
      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish release
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: [verify, assemble]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: dist
      - name: Create the GitHub release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.verify.outputs.tag }}
          EVENT: ${{ github.event_name }}
        run: |
          set -eu
          # A manual run creates the tag on this commit; it must not exist yet.
          if [ "$EVENT" = "workflow_dispatch" ] && gh api "repos/${GH_REPO}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::tag ${TAG} already exists; bump the version or publish by pushing the tag"
            exit 1
          fi
          # A tag with a hyphen (v0.9.0-preview.1, v1.0.0-rc.1) is a pre-release.
          prerelease=()
          case "${TAG}" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "${TAG}" \
            --target "${GITHUB_SHA}" \
            --title "${TAG}" \
            --generate-notes \
            "${prerelease[@]}" \
            dla-*.tar.gz dla-*.tar.gz.sha256 SHA256SUMS

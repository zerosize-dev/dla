# External analyzer rows for go. The rows with backend dla are the DLA-owned rules implemented in crates/dla-backends/src/dla_rules.
# verified = true means the rule id was seen to exist in the installed tool version; verified = false rows are listed as unverified in docs/VERIFY.md.

[[detector]]
id = "staticcheck/SA1015"
backend = "staticcheck"
rule = "SA1015"
suggested_archetype = "L-WORKER"
verified = false
precision_prior = 0.55
default_enabled = true
note = "time.Tick leaks its ticker when the function is not endless. Did not fire on the verification probe."

[[detector]]
id = "staticcheck/SA2001"
backend = "staticcheck"
rule = "SA2001"
suggested_archetype = ""
verified = true
precision_prior = 0.05
default_enabled = true
note = "Empty critical section. Not a leak rule; kept as a signal for lock misuse."

[[detector]]
id = "staticcheck/SA2003"
backend = "staticcheck"
rule = "SA2003"
suggested_archetype = ""
verified = true
precision_prior = 0.05
default_enabled = true
note = "Deferred Lock right after Lock. Not a leak rule."

[[detector]]

# DLA-owned rules (backend "dla"), implemented in crates/dla-backends/src/dla_rules.
[[detector]]
id = "dla/go-goroutine-no-stop-path"
backend = "dla"
rule = "go-goroutine-no-stop-path"
suggested_archetype = "L-WORKER"
verified = true
precision_prior = 0.45
default_enabled = true
note = "go statement whose function loops forever (or ranges over a channel nobody closes) with no done, context or stop path."

[[detector]]
id = "dla/go-time-tick"
backend = "dla"
rule = "go-time-tick"
suggested_archetype = "L-WORKER"
verified = true
precision_prior = 0.6
default_enabled = true
note = "time.Tick leaks its ticker; use time.NewTicker and Stop."

[[detector]]
id = "dla/go-ticker-no-stop"
backend = "dla"
rule = "go-ticker-no-stop"
suggested_archetype = "L-WORKER"
verified = true
precision_prior = 0.5
default_enabled = true
note = "time.NewTicker result never has Stop called in the file."

# Known leaks: documented behavior of a runtime or library that looks like a leak,
# or hides one. Every entry cites the public page that states it. `dla probe` checks
# each entry against the project and writes the verdict to probe evidence. An entry
# is context for the analysis; it never becomes a finding.

[[leak]]
id = "go-timer-unstopped-before-1.23"
runtime = "go"
library = "go"
versions = "<1.23"
when = { source_regex = 'time\.(?:NewTimer|NewTicker|Tick|After|AfterFunc)\(' }
effect = "Before Go 1.23 an unstopped Timer is not collected until it fires, and an unstopped Ticker is never collected. A loop that makes one per pass grows the runtime timer heap."
holder = "registration-table"
evidence = "https://go.dev/doc/go1.23"
remedy = "Call Stop on every Timer and Ticker (defer t.Stop()), or raise the go line in go.mod to 1.23.0 or later."

[[leak]]
id = "go-timer-asynctimerchan-revert"
runtime = "go"
library = "go"
versions = ">=1.23"
when = { all = [
  { config = { key = "asynctimerchan", value = "1" } },
  { source_regex = 'time\.(?:NewTimer|NewTicker|Tick|After|AfterFunc)\(' },
] }
effect = "GODEBUG asynctimerchan=1 restores the old timer behavior even when go.mod names Go 1.23.0 or later, so unstopped Timers and Tickers are not collected again."
holder = "registration-table"
evidence = "https://go.dev/doc/go1.23"
remedy = "Remove asynctimerchan=1 from the godebug lines and the GODEBUG environment, or stop every Timer and Ticker."

[[leak]]
id = "jvm-netty-leak-detection-sampling"
runtime = "jvm"
library = "netty"
aliases = ["io.netty:*", "netty-all", "netty-buffer", "netty-handler", "netty-transport"]
versions = "*"
when = { not = { any = [
  { config = { key = "io.netty.leakDetection.level", value = "paranoid" } },
  { config = { key = "io.netty.leakDetectionLevel", value = "paranoid" } },
] } }
effect = "Netty's default leak detection level (SIMPLE) checks about 1% of buffers, so a missing LEAK log line does not show that buffers are released."
holder = "native-handle/global-ref"
evidence = "https://netty.io/wiki/reference-counted-objects.html"
remedy = "Run the workload with -Dio.netty.leakDetection.level=paranoid, which checks every buffer."

[[leak]]
id = "jvm-spring-simple-cache"
runtime = "jvm"
library = "spring-boot"
aliases = ["org.springframework.boot:*", "spring-boot-starter-cache", "spring-boot-starter-web"]
versions = "*"
when = { all = [
  { source_regex = '@(?:Cacheable|EnableCaching)\b' },
  { not = { any = [
    { library = { name = "com.github.ben-manes.caffeine:caffeine" } },
    { library = { name = "caffeine" } },
    { library = { name = "ehcache" } },
    { library = { name = "org.ehcache:ehcache" } },
    { library = { name = "org.springframework.boot:spring-boot-starter-data-redis" } },
    { library = { name = "spring-boot-starter-data-redis" } },
    { library = { name = "hazelcast" } },
  ] } },
  { not = { config = { key = "spring.cache.type" } } },
] }
effect = "With no cache library Spring Boot configures the simple provider, a ConcurrentHashMap cache store that the documentation does not recommend for production. The page states no size limit or expiry, so entries stay until evicted by hand."
holder = "container-field"
evidence = "https://docs.spring.io/spring-boot/reference/io/caching.html"
remedy = "Set a bounded provider such as Caffeine with maximumSize and expireAfterWrite, or evict explicitly."

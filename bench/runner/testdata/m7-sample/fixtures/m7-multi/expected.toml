schema_version = 1
id = "m7-multi"
runtime = "python"
category = "multi-leak"
dynamic_confirmation = true

[task]
prompt = "The process grows."

[[leak]]
id = "L1"
site = "src/c.py:3"
holder = "container-field"
region = "heap"
cause = "L-COLLECT"

[[leak]]
id = "L2"
site = "src/d.py:8"
holder = "static/global"
region = "heap"
cause = "UNCLASSIFIED"


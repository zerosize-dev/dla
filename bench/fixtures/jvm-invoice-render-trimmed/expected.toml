schema_version = 1
id = "jvm-invoice-render-trimmed"
runtime = "jvm"
category = "decoy-control"
pair = "jvm-invoice-render"
dynamic_confirmation = true

[task]
prompt = """
The invoicing service's heap usage keeps climbing under steady traffic: after every batch of invoices the live set is larger than it was after the previous one, and the process is restarted about every other day. Find out what is holding the memory.
"""

[[non_leak]]
id = "N1"
site = "src/billing/RenderContext.java:13"
cause = "N-HWM"
discriminator = "each worker thread's list is cut back to its starting length after every invoice, so it never holds more than the segments of the largest single invoice; the post-GC heap is flat from 600 invoices onward and the slope of the second half is zero"

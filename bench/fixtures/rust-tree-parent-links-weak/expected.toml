schema_version = 1
id = "rust-tree-parent-links-weak"
runtime = "rust"
category = "decoy-control"
pair = "rust-tree-parent-links"
dynamic_confirmation = true

[task]
prompt = """
Operators report that the outline service's resident memory grows in step with the number of documents it has processed, and the pod is restarted by the orchestrator every few days. Nothing is cached on purpose and each request's data should be gone when the response is sent. Find out what is holding the memory.
"""

[[non_leak]]
id = "N1"
site = "src/section.rs:27"
cause = "N-ALLOC"
discriminator = "every section tree is freed when its request ends: the back-link is a Weak reference, and live allocations are 2 to 3 blocks, under 600 bytes, after every document at 2000 and at 8000 documents; resident memory (figures exclude launcher overhead) is flat at about 2.3 to 2.5 MB from the first 500 documents on, so the slope of the second half is zero"

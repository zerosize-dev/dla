schema_version = 1
id = "jvm-billing-private-repo"
runtime = "jvm"
category = "impossible"
dynamic_confirmation = false

[task]
prompt = """
The charge gateway's heap occupancy climbs through the working day and comes
back down only when the service is restarted. Find out what is holding the
memory.
"""

[[leak]]
id = "L1"
site = "src/main/java/billing/InFlightCharges.java:13"
lines = [13, 13]
alt_sites = [
  "src/main/java/billing/InFlightCharges.java:8",
  "src/main/java/billing/ChargeService.java:26",
]
holder = "static/global"
region = "heap"
cause = "L-COLLECT"
share = 1.0
confirmable = false

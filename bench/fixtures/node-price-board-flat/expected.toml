schema_version = 1
id = "node-price-board-flat"
runtime = "node"
category = "decoy-control"
pair = "node-price-board"
dynamic_confirmation = true

[task]
prompt = """
The price board service's heap climbs steadily while it publishes market updates: after every burst of updates the live heap is larger than after the previous burst, even though only the latest snapshot per instrument is ever served, and the process is restarted about once a day. Find out what is holding the memory.
"""

[[non_leak]]
id = "N1"
site = "src/board.js:15"
cause = "N-WARM"
discriminator = "the closure captures only the previous tick count, a number, so no snapshot is reachable from an older one; heap after GC stays near 50 KB from 500 to 32000 updates and the slope of the second half is zero"

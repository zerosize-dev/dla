site = "archive/reader.py:17"
cause = "N-WARM"
discriminator = "traced memory stays at 0 KB over the baseline and the count of allocated blocks stays at base + 11 or 12 at 2000 and at 8000 reads, although two thirds of the reads (5334 of 8000) take the fallback decoder after the options were rejected; the process is flat from the first reading"
